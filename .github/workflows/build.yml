name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -1)
          mvn -B -f "$POM" package
      - uses: actions/upload-artifact@v4
        with:
          name: Villages-jar
          path: '**/target/Villages-*.jar'
